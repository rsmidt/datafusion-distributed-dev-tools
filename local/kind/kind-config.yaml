kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dfd-bench
# Lets nodes pull from the local registry configured by up.sh.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    extraPortMappings:
      # RustFS NodePort, reached by the local benchmark clients.
      - containerPort: 30900
        hostPort: 9900
        listenAddress: 127.0.0.1
  - role: worker
  - role: worker
  - role: worker
  - role: worker
