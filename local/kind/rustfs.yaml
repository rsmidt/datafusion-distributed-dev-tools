# Stand-in for an existing S3-compatible bucket. Only local/kind uses this.
# Not named "s3": ClickHouse reads hosts containing ".s3." as virtual-hosted buckets.
apiVersion: v1
kind: Namespace
metadata:
  name: object-store
---
apiVersion: v1
kind: Secret
metadata:
  name: rustfs
  namespace: object-store
stringData:
  RUSTFS_ACCESS_KEY: benchmark
  RUSTFS_SECRET_KEY: benchmark-secret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: object-store
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: object-store
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.1
          envFrom:
            - secretRef:
                name: rustfs
          env:
            - name: RUSTFS_ADDRESS
              value: ":9000"
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: object-store
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
      nodePort: 30900
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-bucket
  namespace: object-store
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: rclone/rclone:1.75.2
          args:
            - mkdir
            - :s3:benchmarks
            - --s3-provider=Other
            - --s3-endpoint=http://rustfs.object-store.svc.cluster.local:9000
          env:
            - name: RCLONE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: rustfs, key: RUSTFS_ACCESS_KEY}
            - name: RCLONE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: rustfs, key: RUSTFS_SECRET_KEY}
