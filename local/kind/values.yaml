# kind nodes all share the laptop's CPUs and memory, so limits stand in for
# node sizes; every engine sizes itself to its limits. Not representative for
# timing.
workerResources:
  requests:
    cpu: "1"
    memory: 3Gi
  limits:
    cpu: "2"
    memory: 3Gi
coordinatorResources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 3Gi
