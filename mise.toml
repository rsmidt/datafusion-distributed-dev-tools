# Tools for the benchmark harness and the local kind target.
# Not managed here: docker (kind, Spark image) and rustup, which selects the
# Rust version from each crate's rust-toolchain.toml.
[tools]
node = "24"
kubectl = "1.37.0"
helm = "4.3.1"
kind = "0.33.0"
# DataFusion and Ballista Linux builds.
zig = "0.14.1"
"cargo:cargo-zigbuild" = "0.20.1"
# Ballista build.
protoc = "33.6"
