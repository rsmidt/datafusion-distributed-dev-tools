apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-worker
  namespace: benchmark-datafusion
  labels:
    app.kubernetes.io/name: {{ .Values.name }}-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}-worker
    spec:
      serviceAccountName: benchmark-engine
      {{- with .Values.workerNodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ .Values.name }}-worker
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: download-worker
          image: {{ .Values.worker.artifactImage | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - rclone copyto {{ printf ":s3:%s" (required "worker.artifact is required" .Values.worker.artifact | trimPrefix "s3://") | quote }} /opt/benchmark/worker --s3-provider Other --s3-env-auth --s3-endpoint "$AWS_ENDPOINT_URL" --s3-region "$AWS_REGION" && chmod 0755 /opt/benchmark/worker
          envFrom:
            - secretRef:
                name: benchmark-s3
          volumeMounts:
            - name: worker-binary
              mountPath: /opt/benchmark
      containers:
        - name: worker
          image: {{ .Values.worker.runtimeImage | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /opt/benchmark/worker
          args:
            - --bucket
            - {{ required "worker.datasetBucket is required" .Values.worker.datasetBucket | quote }}
            - --worker-dns-name
            - {{ printf "%s-workers.benchmark-datafusion.svc.cluster.local" .Values.name | quote }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - secretRef:
                name: benchmark-s3
          ports:
            - name: http
              containerPort: 9000
            - name: grpc
              containerPort: 9001
          resources:
            {{- toYaml (required "workerResources is required" .Values.workerResources) | nindent 12 }}
          volumeMounts:
            - name: worker-binary
              mountPath: /opt/benchmark
      volumes:
        - name: worker-binary
          emptyDir: {}
